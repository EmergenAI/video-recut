<!doctype html>
<!--
  Worked example: three stills with slow push-ins, one speech segment per voice file, and
  word-by-word captions — all timed from timeline.js (built by scripts/timeline.mjs).
  Layout of the composition folder:
    index.html            this file
    timeline.js           generated: window.TIMELINE (segments, units, cues, duration)
    vendor/gsap.min.js    copied by `render.mjs init`
    assets/shot1.jpg …    pictures
    audio/s1.wav …        speech, one file per script segment (paths as written in script.json)
  Render: node <skill>/scripts/render.mjs render <composition> renders/draft.mp4 --quality draft
-->
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<script src="vendor/gsap.min.js"></script>
<script src="timeline.js"></script>
<style>
  /* Every font family used needs an @font-face: local() for an installed font, url() for a file. */
  @font-face { font-family: "Caption"; src: local("Microsoft YaHei Bold"), local("PingFang SC Semibold"), local("Noto Sans CJK SC Bold"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Caption"; }
  /* Timed elements start hidden; the runtime shows each inside its data-start/data-duration window. */
  .clip { position: absolute; inset: 0; visibility: hidden; }
  .shot { width: 100%; height: 100%; object-fit: cover; }
  /* Captions: a plain (untimed) layer; each Cue fades in and out through the timeline. */
  #captions { position: absolute; left: 60px; right: 60px; bottom: 260px; height: 220px; }
  .cue { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
         text-align: center; opacity: 0; font-size: 68px; font-weight: 700; line-height: 1.3;
         color: #fff; text-shadow: 0 3px 14px rgba(0, 0, 0, .8); }
  /* The inline line keeps the script's spaces; spans as direct flex items would drop them. */
  .line { white-space: pre-wrap; }
  .unit { color: rgba(255, 255, 255, .45); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
  <!-- Pictures: one track (index 0); clips on one track never overlap. Times in seconds. -->
  <img id="shot1" class="clip shot" src="assets/shot1.jpg" data-start="0" data-duration="5" data-track-index="0"/>
  <img id="shot2" class="clip shot" src="assets/shot2.jpg" data-start="5" data-duration="5.25" data-track-index="0"/>
  <img id="shot3" class="clip shot" src="assets/shot3.jpg" data-start="10.25" data-duration="3" data-track-index="0"/>
  <div id="captions"></div>
</div>
<script>
  var T = window.TIMELINE;
  var root = document.getElementById("root");
  var tl = gsap.timeline({ paused: true });

  // Speech: one <audio> per segment, placed where the timeline put it.
  T.segments.forEach(function (s, i) {
    var a = document.createElement("audio");
    a.id = "voice-" + s.id;
    a.src = s.audio;
    a.setAttribute("data-start", s.start);
    a.setAttribute("data-duration", s.audioDuration);
    a.setAttribute("data-track-index", 20 + i);
    root.appendChild(a);
  });

  // Captions: one element per Cue, one span per unit; each unit lights at its spoken start.
  var box = document.getElementById("captions");
  var HOLD = 0.25; // visible time after the last word of a Cue, cut short by the next Cue
  var cues = [];
  T.segments.forEach(function (s) {
    s.cues.forEach(function (c) { cues.push({ segment: s, cue: c }); });
  });
  cues.forEach(function (entry, n) {
    var s = entry.segment, c = entry.cue;
    var cue = document.createElement("div");
    cue.className = "cue";
    var line = document.createElement("p");
    line.className = "line";
    cue.appendChild(line);
    for (var k = c.units[0]; k < c.units[1]; k++) {
      var u = s.units[k];
      var space = u.space || "";
      var span = document.createElement("span");
      span.className = "unit";
      span.textContent = (k === c.units[0] ? space.trimStart() : space) + u.text;
      line.appendChild(span);
      tl.set(span, { color: "#fff" }, u.start);
    }
    box.appendChild(cue);
    var hide = c.end + HOLD;
    if (n + 1 < cues.length) hide = Math.min(hide, cues[n + 1].cue.start);
    tl.set(cue, { opacity: 1 }, c.start);
    tl.set(cue, { opacity: 0 }, hide);
  });

  // Picture motion: transform only; the runtime owns visibility.
  tl.fromTo("#shot1", { scale: 1 }, { scale: 1.08, duration: 5, ease: "none" }, 0);
  tl.fromTo("#shot2", { scale: 1.08, xPercent: 0 }, { scale: 1, xPercent: -2, duration: 5.25, ease: "none" }, 5);
  tl.fromTo("#shot3", { scale: 1 }, { scale: 1.06, duration: 3, ease: "none" }, 10.25);

  tl.set({}, {}, T.duration); // the composition lasts as long as the timeline
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
